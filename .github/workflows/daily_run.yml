name: ESG Intelligence Daily Sweep
on:
  schedule:
    # 09:00 AM IST = 03:30 AM UTC
    - cron: '30 3 * * *'
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 pandas openpyxl feedparser lxml playwright

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/daily_run.yml') }}

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Pre-flight — Gemini check
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PYEOF'
          import os, requests

          key = os.environ.get("GEMINI_API_KEY", "")
          print(f"[PRE-FLIGHT] GEMINI_API_KEY set: {bool(key)}")
          if not key:
              print("[PRE-FLIGHT] Secret missing — add GEMINI_API_KEY in Settings > Secrets")
              raise SystemExit(1)

          url = (
              "https://generativelanguage.googleapis.com/v1beta/models/"
              "gemini-3.5-flash:generateContent"
          )
          resp = requests.post(
              url,
              params={"key": key},
              json={"contents": [{"parts": [{"text": "Reply with the word: ok"}]}]},
              timeout=30,
          )
          print(f"[PRE-FLIGHT] HTTP status: {resp.status_code}")
          if resp.status_code == 200:
              print("[PRE-FLIGHT] Gemini connection confirmed")
          else:
              print(f"[PRE-FLIGHT] Error body: {resp.text[:500]}")
              raise SystemExit(1)
          PYEOF

      - name: Run ESG Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py

      - name: Persist History & Email Archive
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "ESG Intelligence Bot"
          git add Historical_Matches.csv Email_Summary.html || true
          git diff --staged --quiet || \
            git commit -m "chore: daily sweep $(date '+%Y-%m-%d') [skip ci]"
          git push || true
