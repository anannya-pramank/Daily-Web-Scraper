name: ESG Intelligence Daily Sweep
on:
  # No cron: GitHub schedules start hours late. The Power Automate flow
  # "ESG Scraper 6am Trigger" dispatches this at 05:45 IST (00:15 UTC) and the
  # "Daily ESG Scraper Email Forwarder" flow releases the email at 06:00 IST.
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the laptop already delivered today's digest"
        type: boolean
        default: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # The laptop runner (run_local.py, Windows Task Scheduler, 05:15 IST)
      # sweeps from an Indian IP first — eprocure.gov.in resets connections
      # from GitHub's US runners. When it delivered today it writes
      # local_run.txt, and this run (dispatched 05:45 IST) stands down; it
      # only sweeps as the fallback when the laptop missed the day.
      - name: Skip if the laptop already delivered today
        id: gate
        run: |
          TODAY=$(TZ=Asia/Kolkata date '+%Y-%m-%d')
          if [ "${{ inputs.force }}" != "true" ] && grep -qs "^$TODAY" local_run.txt; then
            echo "Laptop already delivered the $TODAY digest — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.skip != 'true'
        name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - if: steps.gate.outputs.skip != 'true'
        name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 pandas openpyxl feedparser lxml playwright playwright-stealth

      - if: steps.gate.outputs.skip != 'true'
        name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/daily_run.yml') }}

      - if: steps.gate.outputs.skip != 'true'
        name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - if: steps.gate.outputs.skip != 'true'
        name: Pre-flight — Gemini check
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PYEOF'
          import os, requests

          key = os.environ.get("GEMINI_API_KEY", "")
          print(f"[PRE-FLIGHT] GEMINI_API_KEY set: {bool(key)}")
          if not key:
              print("[PRE-FLIGHT] Secret missing — add GEMINI_API_KEY in Settings > Secrets")
              raise SystemExit(1)

          url = (
              "https://generativelanguage.googleapis.com/v1beta/models/"
              "gemini-2.5-flash:generateContent"
          )
          resp = requests.post(
              url,
              params={"key": key},
              json={"contents": [{"parts": [{"text": "Reply with the word: ok"}]}]},
              timeout=30,
          )
          print(f"[PRE-FLIGHT] HTTP status: {resp.status_code}")
          if resp.status_code == 200:
              print("[PRE-FLIGHT] Gemini connection confirmed")
          else:
              print(f"[PRE-FLIGHT] Error body: {resp.text[:500]}")
              raise SystemExit(1)
          PYEOF

      - if: steps.gate.outputs.skip != 'true'
        name: Run ESG Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python scraper.py

      - if: steps.gate.outputs.skip != 'true'
        name: Persist History & Email Archive
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "ESG Intelligence Bot"
          git add Historical_Matches.csv Email_Summary.html || true
          git diff --staged --quiet || \
            git commit -m "chore: daily sweep $(date '+%Y-%m-%d') [skip ci]"
          git push || true
