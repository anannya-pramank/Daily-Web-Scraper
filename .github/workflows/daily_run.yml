name: ESG Intelligence Daily Sweep

on:
  schedule:
    # 09:00 AM IST = 03:30 AM UTC
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 pandas openpyxl feedparser lxml playwright

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/daily_run.yml') }}

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run ESG Scraper
        run: python scraper.py

      - name: Persist History & Email Archive
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "ESG Intelligence Bot"
          git add Historical_Matches.csv Email_Summary.html || true
          git diff --staged --quiet || \
            git commit -m "chore: daily sweep $(date '+%Y-%m-%d') [skip ci]"
          git push || true
