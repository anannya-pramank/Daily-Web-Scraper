name: Independent Automated Scraper Run

on:
  schedule:
    # Runs precisely at 09:00 AM IST (03:30 AM UTC) daily
    - cron: '30 3 * * *'
  workflow_dispatch: # Retains manual manual execution button trigger

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Access Repository Files
      uses: actions/checkout@v3

    - name: Initialize Environment Runtime
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Provision Required Module Libraries
      run: |
        pip install requests beautifulsoup4 pandas openpyxl

    - name: Run Web Scraper Engine
      run: python scraper.py

    - name: Commit and Save Internal History Memory State
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions Automated Pipeline"
        git add Historical_Matches.csv Email_Summary.html || true
        git commit -m "Automated update: Track memory and refresh email template [skip ci]" -a || true
        git push || true
